version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: techgolf-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-techgolf}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-techgolf_secret_password}
      POSTGRES_DB: ${DB_NAME:-techgolf_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-techgolf} -d ${DB_NAME:-techgolf_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: techgolf-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
